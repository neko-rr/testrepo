<!DOCTYPE html>
<html lang="ja">
  <head>
    <!-- ウェブページの文字エンコーディングを指定するために使用されます。 -->
    <meta charset="utf-8" />
    <!-- ウェブページのビューポート（表示領域）の設定を指定します。 -->
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- ウェブページのタイトルに使用されます。 -->
    <title>Taro's Scenery</title>
    <!-- ウェブページの簡潔な説明や概要を提供するために使用されます。 -->
    <meta name="description" content="フォトグラファーの山田太郎です" />
    <!-- モバイルブラウザが電話番号の検出やリンク化を行わないように設定しています。 -->
    <meta name="format-detection" content="telephone=no" />
    <!-- ファビコンの設定 -->
    <link rel="icon" href="image\favicon.ico" />
    <!-- reset.cssは、destyleを使用しています。 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/destyle.css@1.0.15/destyle.css"
    />
    <!-- スタイルシート（css）を呼び出しています -->
    <link rel="stylesheet" href="css\style.css" />
  </head>
    <body>
<!-- header -->
  <header class="header u-wrapper">
      <h1 class="header__title">Taro's Scenery</h1>
      <nav>
        <ul class="header__nav">
          <li><a href="#about">ABOUT</a></li>
          <li><a href="#works">WORKS</a></li>
        </ul>
      </nav>
  </header>
<!-- /header -->
<main>
  <!-- about -->
    <section class="about u-wrapper" id="about">
      <h2 class="u-section__title">ABOUT</h2>
      <div class="about__img-wrapper">
      <img
        src="image\about.png"
        alt="山田太郎のプロフィール写真"
        class="about__img"
        />
        <div class="about__text-wrapper">
        <h3 class="about__name">山田太郎</h3>
        <p class="about__text">
          風景写真を撮影しています。<br />
          日本各地の美しい風景を求めて旅をしています。<br />
          このサイトでは、私の作品や撮影スポット、写真に関する情報を紹介しています。<br />
          ぜひご覧ください。
        </p>
        </div>
      </div>
    </section>
  <!-- about -->
  <!-- works -->
    <section class="works u-wrapper u-sectionWrapper" id="works">
      <h2 class="u-section__title">WORKS</h2>
      <ul class="works__list">
        <li class="works__item">
          <img
            src="image\works1.png"
            alt="日の出の風景写真"
            class="works__img"
          />
          <p class="works__caption">Sunrise</p>
        </li>
        <li class="works__item">
          <img
            src="image\works2.png"
            alt="都会の夜景写真"
            class="works__img"
          />
          <p class="works__caption">Night View</p>
        </li>
        <li class="works__item">
          <img
            src="image\works3.png"
            alt="人工アート階段写真"
            class="works__img"
          />
          <p class="works__caption">Architecture</p>
        </li>
      </ul>
    </section>
  <!-- works -->
</main>
<!-- footer -->
  <footer class="footer">
    <p class="footer__text">© 2023 Taro's Scenery</p>
  </footer>
<!-- /footer -->
    </body>
</html>
